# Environnement de développement local (lot L00). Valeurs explicitement factices, aucune donnée
# de production ici (`.claude/rules/devops.md`). Images épinglées par version, aucun `:latest`.
name: restaurant-saas-dev

services:
  postgres:
    # L5 (audit-2.md) : digest du manifeste multi-architecture obtenu via l'API Docker Hub
    # (`GET /v2/repositories/library/postgres/tags/16.15-alpine`, champ `digest`, 2026-09-24).
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_dev
      POSTGRES_PASSWORD: dev-only-password-not-real
      POSTGRES_DB: app_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_dev -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # L5 (audit-2.md) : digest obtenu via l'API Docker Hub
    # (`GET /v2/repositories/library/redis/tags/7.4-alpine`, champ `digest`, 2026-09-24).
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # L5 (audit-2.md) : digest obtenu via l'API Docker Hub
    # (`GET /v2/repositories/axllent/mailpit/tags/v1.20.7`, champ `digest`, 2026-09-24).
    image: axllent/mailpit:v1.20.7@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # UI web
      - "127.0.0.1:1025:1025" # SMTP factice
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

  # H4 (audit-2.md) : `localstack/localstack:2026.08.4` s'est révélé être l'image LocalStack
  # **Pro** (le dépôt communautaire est archivé, l'offre gratuite n'est plus utilisable sans compte).
  # Remplacé par SeaweedFS sur arbitrage du fil principal (Opus) — voir la justification complète,
  # les vérifications (tag, digest, entrypoint/commande, healthcheck) et les alternatives écartées
  # dans `docs/architecture/self-hosting.md` (section « Stockage S3 en développement »).
  s3:
    # Tag 4.47 (dernière version stable au 2026-09-24) — licence Apache-2.0, sans compte,
    # S3-compatible. Digest vérifié par octet (`sha256sum` du manifeste téléchargé via l'API du
    # registre == digest ci-dessous), voir self-hosting.md.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    # Commande par défaut de l'image (`mini -dir=/data`) : mode "mini" officiellement recommandé
    # par le projet pour l'usage S3 en développement, démarre un cluster à processus unique
    # (master + volume + filer + S3 + admin) avec le serveur S3 activé par défaut (`-s3=true`,
    # port 8333) — vérifié dans `weed/command/mini.go` en amont. Repris ici explicitement plutôt
    # que de dépendre implicitement du `CMD` de l'image.
    command: ["mini", "-dir=/data"]
    ports:
      - "127.0.0.1:8333:8333" # port S3 (seul port utilisé par ce lot ; master/volume/filer/admin non exposés)
    volumes:
      - s3_data:/data
    healthcheck:
      # `/healthz` du serveur master intégré (toujours actif en mode "mini", port 9333 interne) :
      # vérifié dans `weed/server/master_server.go` en amont — répond 200 sans dépendre de l'état
      # du cluster (liveness pure). `curl` est présent dans l'image (installé par le Dockerfile
      # amont : `apk add --no-cache fuse curl su-exec ...`), vérifié dans la configuration de
      # l'image via l'API du registre (voir self-hosting.md) et le Dockerfile source.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  s3_data:
