# Environnement de développement local (lot L00). Valeurs explicitement factices, aucune donnée
# de production ici (`.claude/rules/devops.md`). Images épinglées par version, aucun `:latest`.
name: restaurant-saas-dev

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_dev
      POSTGRES_PASSWORD: dev-only-password-not-real
      POSTGRES_DB: app_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_dev -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # UI web
      - "127.0.0.1:1025:1025" # SMTP factice
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

  # H4 (audit-1.md) : `minio/minio:RELEASE.2024-08-29T01-40-52Z` est introuvable sur Docker Hub —
  # le dépôt `minio/minio` lui-même n'existe plus (`GET /v2/repositories/minio/minio/` → 404 le
  # 2026-09-24). Remplacé par LocalStack (service S3 uniquement), voir la justification et la
  # méthode de vérification dans `docs/architecture/self-hosting.md` (section « Stockage S3 en
  # développement »).
  s3:
    image: localstack/localstack:2026.08.4
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-central-1
      # Identifiants factices : LocalStack ne vérifie aucune signature réelle en développement.
      AWS_ACCESS_KEY_ID: dev-only-access-key
      AWS_SECRET_ACCESS_KEY: dev-only-secret-key
    ports:
      - "127.0.0.1:4566:4566" # port "edge" unique : API S3 (et les autres API AWS émulées, non utilisées ici)
    volumes:
      - s3_data:/var/lib/localstack
    healthcheck:
      # Commande officielle de l'image (voir `HEALTHCHECK` dans le Dockerfile amont) : réutilisée
      # telle quelle plutôt que de deviner un binaire, car vérifiée présente (justification dans
      # self-hosting.md).
      test:
        ["CMD", "/opt/code/localstack/.venv/bin/localstack", "status", "services", "--format=json"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  s3_data:
