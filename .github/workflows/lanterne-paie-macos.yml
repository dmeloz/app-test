name: Lanterne Paie (macOS)

# Tests de l'application de préparation des salaires sur un Mac (serveur GitHub), puis fabrication
# de « Lanterne Paie.app », téléchargeable dans l'onglet Actions (rubrique « Artifacts »).
# Aucune donnée réelle : les tests n'utilisent que des données fictives.

on:
  push:
    paths:
      - "APPL/**"
      - ".github/workflows/lanterne-paie-macos.yml"
  pull_request:
    paths:
      - "APPL/**"
  workflow_dispatch:

concurrency:
  group: lanterne-paie-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: APPL
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Contrôle du code
        run: python -m pyflakes lanterne_paie tests

      - name: Tests (macOS, interface hors écran)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs

      - name: Fabriquer l'application
        run: |
          python -m PyInstaller --noconfirm --windowed --name "Lanterne Paie" \
            --add-data "ressources:ressources" \
            --osx-bundle-identifier ch.lanterne-magique.paie \
            lancer.py
          ditto -c -k --keepParent "dist/Lanterne Paie.app" "dist/Lanterne-Paie-macOS.zip"

      - name: Vérifier que l'application démarre
        env:
          QT_QPA_PLATFORM: offscreen
          LANTERNE_TEST_DEMARRAGE: "1"
        run: |
          "dist/Lanterne Paie.app/Contents/MacOS/Lanterne Paie"

      - name: Publier l'application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lanterne-Paie-macOS
          path: APPL/dist/Lanterne-Paie-macOS.zip
          retention-days: 30
